<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><style>text{font-family:Arial,sans-serif;fill:#15243a}.h{font-size:32px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:18px}.box{stroke-width:3;rx:18}.dep{fill:#e8f0ff;stroke:#306bb1}.rs{fill:#fff2d9;stroke:#b77b1d}.pod{fill:#e6f7ec;stroke:#23834e}.line{stroke:#41546d;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#41546d"/></marker></defs><text x="600" y="55" text-anchor="middle" class="h">Deployment → ReplicaSet → Pods</text><rect x="350" y="100" width="500" height="110" class="box dep"/><text x="600" y="145" text-anchor="middle" class="t">Deployment</text><text x="600" y="180" text-anchor="middle" class="s">declares image, replicas, rollout strategy</text><path d="M600 210 V270" class="line"/><rect x="400" y="275" width="400" height="100" class="box rs"/><text x="600" y="315" text-anchor="middle" class="t">ReplicaSet</text><text x="600" y="347" text-anchor="middle" class="s">maintains the desired Pod count</text><path d="M600 375 V425 M200 425 H1000 M200 425 V465 M600 425 V465 M1000 425 V465" class="line"/><rect x="80" y="470" width="240" height="100" class="box pod"/><text x="200" y="512" text-anchor="middle" class="t">Pod 1</text><text x="200" y="545" text-anchor="middle" class="s">container(s)</text><rect x="480" y="470" width="240" height="100" class="box pod"/><text x="600" y="512" text-anchor="middle" class="t">Pod 2</text><text x="600" y="545" text-anchor="middle" class="s">container(s)</text><rect x="880" y="470" width="240" height="100" class="box pod"/><text x="1000" y="512" text-anchor="middle" class="t">Pod 3</text><text x="1000" y="545" text-anchor="middle" class="s">container(s)</text><text x="600" y="610" text-anchor="middle" class="s">You normally manage the Deployment; it manages ReplicaSets, which maintain Pods.</text></svg>