<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:600}.s{font-size:17px}.box{fill:#f4f7fb;stroke:#42628a;stroke-width:2;rx:16}.blue{fill:#e6f0ff;stroke:#2762aa;stroke-width:2;rx:16}.green{fill:#e7f7ee;stroke:#23834e;stroke-width:2;rx:16}.line{stroke:#44546a;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44546a"/></marker></defs><text x="600" y="48" text-anchor="middle" class="h">Docker Engine Architecture</text><rect x="40" y="100" width="230" height="140" class="blue"/><text x="155" y="145" text-anchor="middle" class="t">Docker Client</text><text x="155" y="180" text-anchor="middle" class="s">docker CLI</text><text x="155" y="207" text-anchor="middle" class="s">build / pull / run</text><rect x="350" y="90" width="800" height="470" class="box"/><text x="750" y="130" text-anchor="middle" class="t">Docker Host</text><rect x="410" y="165" width="680" height="115" class="blue"/><text x="750" y="207" text-anchor="middle" class="t">Docker Daemon (dockerd)</text><text x="750" y="242" text-anchor="middle" class="s">REST API · images · container lifecycle · networks · volumes</text><rect x="410" y="335" width="205" height="150" class="green"/><text x="512" y="380" text-anchor="middle" class="t">Images</text><text x="512" y="417" text-anchor="middle" class="s">layers</text><text x="512" y="445" text-anchor="middle" class="s">tags</text><rect x="668" y="335" width="205" height="150" class="green"/><text x="770" y="380" text-anchor="middle" class="t">Containers</text><text x="770" y="417" text-anchor="middle" class="s">processes</text><text x="770" y="445" text-anchor="middle" class="s">namespaces / cgroups</text><rect x="926" y="335" width="164" height="150" class="green"/><text x="1008" y="380" te