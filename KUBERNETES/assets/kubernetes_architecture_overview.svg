<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><style>text{font-family:Arial,sans-serif;fill:#142238}.h{font-size:32px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:18px}.small{font-size:16px}.plane{fill:#eef4ff;stroke:#3266a8;stroke-width:3;rx:20}.worker{fill:#f5f8fc;stroke:#5c718e;stroke-width:3;rx:18}.component{fill:#fff;stroke:#4f6f9d;stroke-width:2;rx:12}.pod{fill:#e9f8ef;stroke:#27834c;stroke-width:2;rx:10}.line{stroke:#455a73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#455a73"/></marker></defs><text x="700" y="50" text-anchor="middle" class="h">Kubernetes Cluster Architecture</text><rect x="80" y="95" width="1240" height="280" class="plane"/><text x="700" y="135" text-anchor="middle" class="t">Control Plane</text><rect x="120" y="170" width="250" height="150" class="component"/><text x="245" y="215" text-anchor="middle" class="t">kube-apiserver</text><text x="245" y="253" text-anchor="middle" class="small">API endpoint</text><text x="245" y="280" text-anchor="middle" class="small">auth · validate · persist</text><rect x="410" y="170" width="250" height="150" class="component"/><text x="535" y="215" text-anchor="middle" class="t">kube-scheduler</text><text x="535" y="253" text-anchor="middle" class="small">selects a suitable</text><text x="535" y="280" text-anchor="middle" class="small">node for Pods</text><rect x="700" y="170" width="250" height="150" class="component"/><text x="825" y="215" text-anchor="middle" class="t">controller-manager</text><text x="825" y="253" text-anchor="middle" class="small">reconciliation loops</text><text x="825" y="280" text-anchor="middle" class="small">desired vs actual state</text><rect x="990" y="170" width="270" height="150" class="component"/><text x="1125" y="215" text-anchor="middle" class="t">etcd</text><text x="1125" y="253" text-anchor="middle" class="small">consistent key-value</text><text x="1125" y="280" text-anchor="middle" class="small">cluster state store</text><text x="700" y="420" text-anchor="middle" class="s">Kubernetes API communication</text><path d="M245 375 V440 H375 V480 M245 440 H1025 V480" class="line"/><rect x="80" y="485" width="590" height="270" class="worker"/><text x="375" y="525" text-anchor="middle" class="t">Worker Node 1</text><rect x="110" y="555" width="240" height="75" class="component"/><text x="230" y="600" text-anchor="middle" class="t">kubelet + runtime</text><rect x="380" y="555" width="250" height="75" class="component"/><text x="505" y="600" text-anchor="middle" class="t">kube-proxy (if used)</text><rect x="110" y="660" width="240" height="65" class="pod"/><text x="230" y="700" text-anchor="middle" class="t">Pod A</text><rect x="380" y="660" width="250" height="65" class="pod"/><text x="505" y="700" text-anchor="middle" class="t">Pod B</text><rect x="730" y="485" width="590" height="270" class="worker"/><text x="1025" y="525" text-anchor="middle" class="t">Worker Node 2</text><rect x="760" y="555" width="240" height="75" class="component"/><text x="880" y="600" text-anchor="middle" class="t">kubelet + runtime</text><rect x="1030" y="555" width="250" height="75" class="component"/><text x="1155" y="600" text-anchor="middle" class="t">kube-proxy (if used)</text><rect x="760" y="660" width="240" height="65" class="pod"/><text x="880" y="700" text-anchor="middle" class="t">Pod C</text><rect x="1030" y="660" width="250" height="65" class="pod"/><text x="1155" y="700" text-anchor="middle" class="t">Pod D</text><text x="700" y="820" text-anchor="middle" class="small">The control plane manages desired state; kubelet and the container runtime run workloads on nodes.</text></svg>