<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650"><defs><style>text{font-family:Arial,sans-serif;fill:#17243a}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.box{fill:#f4f7fb;stroke:#476b9b;stroke-width:2.5;rx:16}.green{fill:#e8f7ee;stroke:#2e8450;stroke-width:2.5;rx:14}.orange{fill:#fff2de;stroke:#ba7d22;stroke-width:2.5;rx:14}.line{stroke:#455a73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#455a73"/></marker></defs><text x="650" y="55" text-anchor="middle" class="h">Kubernetes Service and Ingress Traffic Flow</text><rect x="50" y="220" width="180" height="120" class="box"/><text x="140" y="265" text-anchor="middle" class="t">Client</text><text x="140" y="300" text-anchor="middle" class="s">browser / API</text><rect x="310" y="110" width="230" height="120" class="orange"/><text x="425" y="155" text-anchor="middle" class="t">Ingress / Gateway</text><text x="425" y="190" text-anchor="middle" class="s">HTTP routing rules</text><rect x="310" y="390" width="230" height="120" class="box"/><text x="425" y="435" text-anchor="middle" class="t">NodePort / LB</text><text x="425" y="470" text-anchor="middle" class="s">external entry (optional)</text><rect x="650" y="220" width="210" height="120" class="box"/><text x="755" y="265" text-anchor="middle" class="t">Service</text><text x="755" y="300" text-anchor="middle" class="s">stable virtual endpoint</text><rect x="970" y="90" width="260" height="105" class="green"/><text x="1100" y="132" text-anchor="middle" class="t">Pod A</text><text x="1100" y="165" text-anchor="middle" class="s">selected backend</text><rect x="970" y="245" width="260" height="105" class="green"/><text x="1100" y="287" text-anchor="middle" class="t">Pod B</text><text x="1100" y="320" text-anchor="middle" class="s">selected backend</text><rect x="970" y="400" width="260" height="105" class="green"/><text x="1100" y="442" text-anchor="middle" class="t">Pod C</text><text x="1100" y="475" text-anchor="middle" class="s">selected backend</text><path d="M230 260 H300 V170 H305 M230 290 H275 V450 H305 M540 170 H600 V250 H645 M540 450 H600 V310 H645 M860 260 H915 V140 H965 M860 280 H965 M860 300 H915 V450 H965" class="line"/><text x="650" y="580" text-anchor="middle" class="s">Services select eligible Pods, usually through labels; ingress or gateway controllers provide HTTP routing.</text><text x="650" y="612" text-anchor="middle" class="s">A Service does not require Ingress, and Ingress/Gateway require an installed controller.</text></svg>