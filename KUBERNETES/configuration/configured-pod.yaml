apiVersion: v1
kind: Pod
metadata:
  name: configured-nginx
  namespace: demo
  labels:
    app: configured-nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 80
      envFrom:
        - configMapRef:
            name: web-config
        - secretRef:
            name: web-secret
      volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: web-content
      configMap:
        name: web-config
        items:
          - key: index.html
            path: index.html
