apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: students.learning.example.com
spec:
  group: learning.example.com
  scope: Namespaced
  names:
    plural: students
    singular: student
    kind: Student
    shortNames:
      - stu
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - fullName
                - level
              properties:
                fullName:
                  type: string
                  minLength: 1
                level:
                  type: integer
                  minimum: 1
                  maximum: 12
