apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "learning-nginx.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "learning-nginx.name" . }}
    helm.sh/chart: {{ include "learning-nginx.chart" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "learning-nginx.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "learning-nginx.name" . }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
