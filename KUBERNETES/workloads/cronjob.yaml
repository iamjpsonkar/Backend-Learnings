apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-health-check
  namespace: demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: health-check
              image: busybox:1.36
              command: ["sh", "-c", "date; echo 'scheduled job ran'"]
