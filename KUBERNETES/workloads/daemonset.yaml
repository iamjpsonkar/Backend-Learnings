apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-per-node
  namespace: demo
spec:
  selector:
    matchLabels:
      app: nginx-per-node
  template:
    metadata:
      labels:
        app: nginx-per-node
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
