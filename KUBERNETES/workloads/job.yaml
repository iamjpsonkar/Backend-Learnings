apiVersion: batch/v1
kind: Job
metadata:
  name: pi-calculation
  namespace: demo
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: pi-calculation
    spec:
      restartPolicy: Never
      containers:
        - name: calculate
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Starting calculation'; echo '3.1415926535'; echo 'Job completed'"]
